name: Android CI & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Lint & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Run unit tests, Android Lint, and build Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Prepare versioned APK file
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BMW-CarPlay-Probe-v0.1.2-debug.apk
          ls -lh BMW-CarPlay-Probe-v0.1.2-debug.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BMW-CarPlay-Probe-v0.1.2-debug
          path: BMW-CarPlay-Probe-v0.1.2-debug.apk
          if-no-files-found: error

      - name: Publish / update latest_build GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest_build
          name: BMW CarPlay Probe v0.1.2 (latest_build)
          body: |
            Automatski izgrađeni Debug APK za **BMW CarPlay Probe v0.1.2 (Faza 1 — Bežično CarPlay spajanje i dijagnostika protokola)**.

            - `applicationId`: `io.bimmergestalt.bmwcarplay`
            - Izmjene u v0.1.2 (temeljeno na stvarnom logu `BMW 04990` / `HU_ENTRYNAV2`):
              1. **Ispravljen iAP2 Control Session v1 redoslijed**: MFi autentifikacija (`0xAA00 → 0xAA05`) sada ide **PRIJE** identifikacije (`0x1D00 → 0x1D02`), kako nalaže Apple iAP2 Control v1 specifikacija za Alpine `HU_ENTRYNAV2` (uz fallback na obrnuti redoslijed za druge uređaje).
              2. **Vjerno odjekivanje BMW LSP parametara (`ackMs=100`)** i uklonjen 600 ms spam praznih ACK-ova (zamijenjeno tihim 5s keep-aliveom) + garancija da Link ACK uvijek ode prije prve CSM poruke.
              3. **Pamćenje neuspjele MFi duljine preko automatskog BMW reconnecta** (ako 32B prekine vezu, 0.5s kasnije automatski kreće s 20B) + X.509 potpisni algoritam u logu.
              4. **Trenutačni iPhone pozdravni niz (`0x4E0C/A/9/B/D/E`) + `0x5702` + `0x4300`** bez 2s pauze odmah nakon `0x1D02`.
            - Commit: `${{ github.sha }}`
          files: BMW-CarPlay-Probe-v0.1.2-debug.apk
          make_latest: true
          overwrite_files: true
