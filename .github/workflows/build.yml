name: Android CI & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Lint & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version from app/build.gradle.kts
        id: ver
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "apk=BMW-CarPlay-Probe-v${VER}-debug.apk" >> "$GITHUB_OUTPUT"
          echo "artifact=BMW-CarPlay-Probe-v${VER}-debug" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VER"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Run unit tests, Android Lint, and build Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Prepare versioned APK file
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.ver.outputs.apk }}"
          ls -lh "${{ steps.ver.outputs.apk }}"

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.artifact }}
          path: ${{ steps.ver.outputs.apk }}
          if-no-files-found: error

      - name: Remove older APK assets from latest_build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in $(gh release view latest_build --json assets --jq '.assets[].name' 2>/dev/null || true); do
            if [ "$asset" != "${{ steps.ver.outputs.apk }}" ]; then
              gh release delete-asset latest_build "$asset" --yes || true
            fi
          done

      - name: Publish / update latest_build GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest_build
          name: BMW CarPlay Probe v${{ steps.ver.outputs.version }} (latest_build)
          body: |
            Automatski izgrađeni Debug APK za **BMW CarPlay Probe v${{ steps.ver.outputs.version }} (Faza 2A — Live 1280×480 @ 60fps H.264 + Wi-Fi iAP2 handoff + HID dodir/iDrive)**.

            - `applicationId`: `io.bimmergestalt.bmwcarplay`
            - **Novosti u `v0.2.1`** (rješava prekid nakon ~10 s u `v0.2.0` i aktivira HID):
              1. **Virtualni Wi-Fi iAP2 handoff (`iAPSendMessage`)**: automatski odgovara na BMW-ov `FF 55 02 00 EE 10` (`DETECT`) i završava virtualni iAP2 prijelaz (`SYN|ACK → MFi 0xAA00/20B/0xAA05 → 0x1D00/0x1D02`) uz samo-detekciju kanala (`Control :7000` s automatskim prijelazom na `Event kanal`), čime sesija ostaje trajno aktivna preko 10 s i BMW trajno sprema uređaj u ConnectedDrive!
              2. **Naoružavanje sva 4 BMW HID uređaja NAKON `RECORD`** (i ponovno nakon Wi-Fi iAP2 prijelaza) + **dekoder dodira (`1280×480`) i iDrive kotačića**: `TouchDescriptor`, `KnobDescriptor`, `MediaButtons` i `PhoneDescriptor` s živim interaktivnim križićem na testnoj slici tamo gdje prstom dodirneš BMW ekran!
              3. **Provjerena baza iz `v0.2.0`**: Full HomeKit Pairing + ChaCha20-Poly1305 (`MTU ≤ 1422 B`), dinamički `1280×480 @ 60 fps` BT.709 H.264 stream, 3 keep-alivea i aktivan 5G internet.
            - Commit: `${{ github.sha }}`
          files: ${{ steps.ver.outputs.apk }}
          make_latest: true
          overwrite_files: true
