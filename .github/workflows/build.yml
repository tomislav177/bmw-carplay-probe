name: Android CI & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Lint & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version from app/build.gradle.kts
        id: ver
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "apk=BMW-CarPlay-Probe-v${VER}-debug.apk" >> "$GITHUB_OUTPUT"
          echo "artifact=BMW-CarPlay-Probe-v${VER}-debug" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VER"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Run unit tests, Android Lint, and build Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Prepare versioned APK file
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.ver.outputs.apk }}"
          ls -lh "${{ steps.ver.outputs.apk }}"

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.artifact }}
          path: ${{ steps.ver.outputs.apk }}
          if-no-files-found: error

      - name: Remove older APK assets from latest_build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in $(gh release view latest_build --json assets --jq '.assets[].name' 2>/dev/null || true); do
            if [ "$asset" != "${{ steps.ver.outputs.apk }}" ]; then
              gh release delete-asset latest_build "$asset" --yes || true
            fi
          done

      - name: Publish / update latest_build GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest_build
          name: BMW CarPlay Probe v${{ steps.ver.outputs.version }} (latest_build)
          body: |
            Automatski izgrađeni Debug APK za **BMW CarPlay Probe v${{ steps.ver.outputs.version }} (Faza 3A — Android Auto 127.0.0.1:5277 Most + BMW MENU povratak + Automatsko spajanje + stalni potpis APK-a)**.

            - `applicationId`: `io.bimmergestalt.bmwcarplay`
            - **Novosti u `v0.3.0` (Faza 3A)**:
              1. **Android Auto AAP klijent (`127.0.0.1:5277`)**: puni čisti Kotlin AAP protokol (Version 1.6, mTLS 1.2 uz uvoz HU certifikata `.p12`/`.pem`, ServiceDiscovery `1280×720` s `margin_height=240` → čisti aktivni `1280×480 @ 60fps` widescreen, OpenGL ES hardverski video most, 1:1 BMW dodir + 4-smjerni iDrive kotačić + `SCROLL_WHEEL`, čisti `ByeByeRequest` izlaz).
              2. **Gumb „Testiraj AA doma (`127.0.0.1:5277`)“ + prečac za Android Auto postavke**: testiraj AAP vezu kod kuće prije odlaska u auto.
              3. **Prekidač „Automatski spoji pri otvaranju“**: 1 klik na ikonu ili automatsko otvaranje preko Samsung *Načini rada i rutine*.
              4. **Trenutni povratak iz BMW `MENU`**: automatski `modesChanged` + IDR ključni okvir kad BMW pošalje `requestUI` ili `eNOTIFICATION_DONE`.
              5. **Stalni razvojni potpis APK-a (`app/debug.keystore`)**: od `v0.3.0` nadalje svaka nova verzija instalira se **direktno preko postojeće bez deinstalacije**!
            - Commit: `${{ github.sha }}`
          files: ${{ steps.ver.outputs.apk }}
          make_latest: true
          overwrite_files: true
