name: Android CI & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Lint & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Run unit tests, Android Lint, and build Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Prepare versioned APK file
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BMW-CarPlay-Probe-v0.1.3-debug.apk
          ls -lh BMW-CarPlay-Probe-v0.1.3-debug.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BMW-CarPlay-Probe-v0.1.3-debug
          path: BMW-CarPlay-Probe-v0.1.3-debug.apk
          if-no-files-found: error

      - name: Remove older APK assets from latest_build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in $(gh release view latest_build --json assets --jq '.assets[].name' 2>/dev/null || true); do
            if [ "$asset" != "BMW-CarPlay-Probe-v0.1.3-debug.apk" ]; then
              gh release delete-asset latest_build "$asset" --yes || true
            fi
          done

      - name: Publish / update latest_build GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest_build
          name: BMW CarPlay Probe v0.1.3 (latest_build)
          body: |
            Automatski izgrađeni Debug APK za **BMW CarPlay Probe v0.1.3 (Faza 1 — Bežično CarPlay spajanje i dijagnostika protokola)**.

            - `applicationId`: `io.bimmergestalt.bmwcarplay`
            - Izmjene u v0.1.3 (temeljeno na stvarnom `0xAA01` certifikatu iz `BMW 04990` / `HU_ENTRYNAV2`):
              1. **Automatska detekcija Apple MFi 2.0C (CP2.0C) čipa (`SHA1withRSA / RSA`, 908 B certifikat)**: kada auto pošalje MFi 2.0C certifikat, `AUTO` mod sada odmah kao PRVI izazov šalje **20 bajtova** (SHA-1 digest za CP2.0C) umjesto 32 bajta.
              2. **Ispravljen bug s pamćenjem neuspjelih duljina**: ako RFCOMM padne tijekom pričuvnog izazova iza ne-ACK-anog prvog paketa, ispravna duljina se više ne označava kao neuspješna.
              3. **Verzija aplikacije (`v0.1.3`) u prvoj liniji svakog loga** i automatsko čišćenje starih APK-ova s `latest_build` Releasea.
            - Commit: `${{ github.sha }}`
          files: BMW-CarPlay-Probe-v0.1.3-debug.apk
          make_latest: true
          overwrite_files: true
