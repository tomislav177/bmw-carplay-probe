name: Android CI & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Lint & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version from app/build.gradle.kts
        id: ver
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "apk=BMW-CarPlay-Probe-v${VER}-debug.apk" >> "$GITHUB_OUTPUT"
          echo "artifact=BMW-CarPlay-Probe-v${VER}-debug" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VER"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Run unit tests, Android Lint, and build Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Prepare versioned APK file
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.ver.outputs.apk }}"
          ls -lh "${{ steps.ver.outputs.apk }}"

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.artifact }}
          path: ${{ steps.ver.outputs.apk }}
          if-no-files-found: error

      - name: Remove older APK assets from latest_build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in $(gh release view latest_build --json assets --jq '.assets[].name' 2>/dev/null || true); do
            if [ "$asset" != "${{ steps.ver.outputs.apk }}" ]; then
              gh release delete-asset latest_build "$asset" --yes || true
            fi
          done

      - name: Publish / update latest_build GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest_build
          name: BMW CarPlay Probe v${{ steps.ver.outputs.version }} (latest_build)
          body: |
            Automatski izgrađeni Debug APK za **BMW CarPlay Probe v${{ steps.ver.outputs.version }} (Faza 1 — Bežično CarPlay spajanje i dijagnostika protokola)**.

            - `applicationId`: `io.bimmergestalt.bmwcarplay`
            - Izmjene u v0.1.5 (temeljeno na `session_20261127_125452.log`):
              1. **Apple CarPlay SDP UUID-ovi**: uz `Wireless iAP (...decacafe)`, aplikacija sada oglašava i **`CarPlay (2d8d2466-e14d-451c-88bc-7301abea291a)`** (par za BMW-ov `d31fbf50-...88ec` otkriven u logu!) te **`Wireless iAP v2 (02030302-1d19-415f-86f2-22a2106a0a77)`**, uz praćenje svakog kanala na koji se BMW spoji.
              2. **Bez prekidanja prve RFCOMM veze**: HFP/A2DP se više ne odspajaju usred aktivnog dolaznog RFCOMM spajanja (u v0.1.4 to je prekinulo prvu vezu nakon 200 ms tijekom BMW-ove provjere CarPlaya).
              3. **UI ispravci**: vidljiva verzija u zaglavlju aplikacije i zaustavljanje plavog kotačića kad klikneš *Zaustavi*.
            - Commit: `${{ github.sha }}`
          files: ${{ steps.ver.outputs.apk }}
          make_latest: true
          overwrite_files: true
