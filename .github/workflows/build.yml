name: Android CI & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Lint & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version from app/build.gradle.kts
        id: ver
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "apk=BMW-CarPlay-Probe-v${VER}-debug.apk" >> "$GITHUB_OUTPUT"
          echo "artifact=BMW-CarPlay-Probe-v${VER}-debug" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VER"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Run unit tests, Android Lint, and build Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Prepare versioned APK file
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.ver.outputs.apk }}"
          ls -lh "${{ steps.ver.outputs.apk }}"

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.artifact }}
          path: ${{ steps.ver.outputs.apk }}
          if-no-files-found: error

      - name: Remove older APK assets from latest_build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in $(gh release view latest_build --json assets --jq '.assets[].name' 2>/dev/null || true); do
            if [ "$asset" != "${{ steps.ver.outputs.apk }}" ]; then
              gh release delete-asset latest_build "$asset" --yes || true
            fi
          done

      - name: Publish / update latest_build GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest_build
          name: BMW CarPlay Probe v${{ steps.ver.outputs.version }} (latest_build)
          body: |
            Automatski izgrađeni Debug APK za **BMW CarPlay Probe v${{ steps.ver.outputs.version }} (Faza 4A — Zrcaljenje zaslona + OEM CarPlay Dock + BMW Dodir/iDrive + prilagodljivo rezanje rubova)**.

            - `applicationId`: `io.bimmergestalt.bmwcarplay`
            - **Novosti u `v0.4.0` (Faza 4A — BEZ Google Android Auta i bez root-a!)**:
              1. **Zrcaljenje zaslona (`MediaProjection`) + hardverski OpenGL ES 2.0 kompozitor (`MirrorDockGlRenderer`)**: uživo zrcali prave Google Karte, Waze, Spotify i bilo koju Android aplikaciju na punih `1280×480 @ 60 fps` uz `0 %` distorzije (savršeni kružni tokovi!).
              2. **Dva načina prikaza + položaj docka Lijevo/Desno**:
                 - **Smart Crop + tanak OEM Dock (`122 px` ≈ `20 mm`)**: karta na `1158×480 px` (`90,5 %` zaslona), sat + baterija/status, 4 velike ikone po izboru i ◀/⌂ tipke.
                 - **1:1 Fit + širi Dock (`240 px` ≈ `39 mm`)**: `1040×480 px` prikaz, `2×2` ikone aplikacija + ugrađene media kontrole (`⏮ ⏯ ⏭`) + ◀/⌂.
              3. **Klizači za odrezivanje gore i dolje (`0–200 px`)**: sam podešavaš koliko režeš Android statusnu traku i donju gestu — promjene se vide **uživo na BMW zaslonu**, a dodir ostaje točan u piksel!
              4. **4 prilagodljive ikone aplikacija**: sam biraš bilo koje 4 aplikacije sa svog mobitela (s pravim ikonama i pretragom).
              5. **BMW Dodir, iDrive i tipke volana (`BmwTouchAccessibilityService`)**: stvarni dodir i povlačenje Google Karti na BMW ekranu, iDrive `Natrag`/`Početna` + okretanje kotačića kroz 4 dock ikone + tipke volana za glazbu (`Sljedeća`/`Prethodna`/`Pauza`).
              6. **Čišćenje i stalni potpis (`app/debug.keystore`)**: uklonjen nepotrebni Android Auto AAP/certifikat kod; instalira se **direktno preko `v0.3.0` bez deinstalacije**!
            - Commit: `${{ github.sha }}`
          files: ${{ steps.ver.outputs.apk }}
          make_latest: true
          overwrite_files: true
